<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ML Predictor App</title>

    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:       #0a0c10;
            --surface:  #111318;
            --surface2: #181b22;
            --border:   #23272f;
            --accent:   #00e5a0;
            --accent2:  #0077ff;
            --text:     #e8eaf0;
            --muted:    #5a5f72;
            --danger:   #ff4d6a;
        }

        body {
            margin: 0;
            font-family: 'Sora', sans-serif;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ambient grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,229,160,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,229,160,0.03) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
        }

        /* Glowing orb */
        body::after {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,119,255,0.12) 0%, transparent 70%);
            top: -150px;
            right: -150px;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 95%;
            max-width: 560px;
            padding: 20px 0 40px;
            animation: fadeUp 0.7s cubic-bezier(.16,1,.3,1) both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Top label */
        .top-label {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
            animation: fadeUp 0.6s cubic-bezier(.16,1,.3,1) 0.1s both;
        }

        .top-label .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.4; }
        }

        .top-label span {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
        }

        h1 {
            font-size: clamp(22px, 5vw, 32px);
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.02em;
            line-height: 1.15;
            margin-bottom: 8px;
            animation: fadeUp 0.6s cubic-bezier(.16,1,.3,1) 0.15s both;
        }

        h1 span {
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 36px;
            animation: fadeUp 0.6s cubic-bezier(.16,1,.3,1) 0.2s both;
        }

        /* Cards */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
            animation: fadeUp 0.6s cubic-bezier(.16,1,.3,1) 0.25s both;
        }

        .card:nth-child(2) { animation-delay: 0.32s; }

        /* Card accent line top */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent2), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .card:hover::before { opacity: 1; }

        .card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 12px;
            font-family: 'Space Mono', monospace;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card h2::before {
            content: '';
            display: inline-block;
            width: 14px; height: 1px;
            background: var(--accent);
        }

        label {
            display: block;
            margin: 0 0 8px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--muted);
        }

        input[type="number"] {
            width: 100%;
            padding: 14px 16px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Space Mono', monospace;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

        input[type="number"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0,229,160,0.12);
        }

        input[type="number"]::placeholder { color: var(--muted); }

        button {
            margin-top: 20px;
            padding: 14px;
            width: 100%;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--accent), #00b87a);
            color: #021a10;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        button::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0);
            transition: background 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0,229,160,0.35);
        }

        button:hover::after { background: rgba(255,255,255,0.08); }

        button:active { transform: translateY(0); box-shadow: none; }

        .output-box {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px 20px;
            font-family: 'Space Mono', monospace;
            font-size: 16px;
            color: var(--accent);
            min-height: 54px;
            letter-spacing: 0.04em;
            transition: border-color 0.3s;
        }

        .output-box:not(:empty) {
            border-color: rgba(0,229,160,0.3);
            box-shadow: 0 0 20px rgba(0,229,160,0.07);
        }

        .footer {
            text-align: center;
            font-size: 12px;
            font-family: 'Space Mono', monospace;
            color: var(--muted);
            margin-top: 24px;
            letter-spacing: 0.06em;
            animation: fadeUp 0.6s cubic-bezier(.16,1,.3,1) 0.45s both;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="top-label">
        <div class="dot"></div>
        <span>Model · Active</span>
    </div>

    <h1>Machine Learning<br><span>Predictor</span></h1>
    <p class="subtitle">Simple Linear Regression Model. Enter input features to run inference.</p>

    <!-- Input Section -->
    <div class="card">
        <h2>Input Features</h2>

        <!-- CHANGE action="/predict" to your backend route -->
        <form action="/predict" method="post">
            <label>Experience</label>
            <input type="number" step="any" name="experience" placeholder="e.g. 5.0" required>

            <button type="submit">Run Prediction →</button>
        </form>
    </div>

    <!-- Output Section -->
    <div class="card">
        <h2>Prediction Output</h2>
        <div class="output-box">
            <!-- Backend should pass prediction here -->
            {{ prediction }}
        </div>
    </div>

    <div class="footer">
        Built with ❤️ for ML Model Deployment
    </div>

</div>

</body>
</html>
